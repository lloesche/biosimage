name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  driver:
    uses: ./.github/workflows/driver.yml
  release:
    needs: driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: animation-driver
          # Keep the checkout clean until GoReleaser has validated it. Its global
          # before hook installs this tested artifact before any Go compilation.
          path: driver/build/release
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANIMLOGO_DRIVER: driver/build/release/animlogo.efi
