name: Pages

# Deploys web/ to GitHub Pages with the WebAssembly module built from the same commit, so the
# page and the module always match. Runs when either changes on main, after every successful
# release (so the footer shows the new tag), or manually.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "driver/**"
      - "uefi/**"
      - "cmd/wasm/**"
      - "cmd/buildweb/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pages.yml"
      - ".github/workflows/driver.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  driver:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/driver.yml
  deploy:
    needs: driver
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }} # same revision as the shared driver build
          fetch-depth: 0 # tags, for the version
      - uses: actions/download-artifact@v7
        with:
          name: animation-driver
          path: uefi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The version (e.g. v1.4.0, or v1.4.0-3-g0b465ba after it) is in the footer and in the
      # URLs of the worker and the module, so a new deployment does not use cached old ones.
      - name: Build WebAssembly module
        run: go run ./cmd/buildweb -version "$(git describe --tags --always)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
