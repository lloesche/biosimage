name: Vendor firmware

# Tests biosimage against real BIOS images listed in testdata/firmware.json. The files are
# downloaded from the vendors' servers, verified by SHA-256 and kept only in the Actions
# cache. They are never uploaded as artifacts or committed: vendor firmware is not ours to
# redistribute.
#
# Runs only when the parsing code or the manifest changes; the files themselves are pinned
# by hash, so there is nothing new to learn from running on a schedule.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["uefi/**", "go.mod", "go.sum", "testdata/firmware.json", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["uefi/**", "go.mod", "go.sum", "testdata/firmware.json", ".github/workflows/firmware.yml"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      BIOSIMAGE_FIRMWARE_CACHE: ${{ github.workspace }}/../firmware-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ${{ env.BIOSIMAGE_FIRMWARE_CACHE }}
          key: vendor-firmware-${{ hashFiles('testdata/firmware.json') }}
          restore-keys: vendor-firmware-
      - name: Test against vendor firmware
        run: go test ./uefi -run TestVendorFirmware -v -timeout 30m
