name: Pages

# Deploys web/ to GitHub Pages together with the WebAssembly module of the latest release.
# Runs after every successful release, when the web app changes, or manually.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch WebAssembly module from the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null); then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir web \
              --pattern biosimage.wasm --pattern wasm_exec.js
            echo "$tag" > web/version.txt
            echo "built=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet, building from source"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.release.outputs.built == 'true'
        with:
          go-version-file: go.mod
      - name: Build WebAssembly module from source
        if: steps.release.outputs.built == 'true'
        run: go run ./cmd/buildweb -version "dev-$(git rev-parse --short HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
