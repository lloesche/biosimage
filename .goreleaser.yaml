version: 2

before:
  hooks:
    # WebAssembly module for the web app, attached to the release and deployed to Pages.
    - go run ./cmd/buildweb -dir build/web

builds:
  - env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

release:
  extra_files:
    - glob: build/web/biosimage.wasm
    - glob: build/web/wasm_exec.js

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: build/web/biosimage.wasm
